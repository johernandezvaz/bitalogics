<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Andy entra a un cuarto, el sensor lo detecta y la lámpara se enciende sobre él">
  <title>Andy — iluminación por detección de presencia</title>
  <!-- Andy: misma geometría que andy-base.svg, desplazado (dx 200, dy 112) -->

  <!-- Techo y piso -->
  <g fill="none" stroke="#16283F" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round">
    <path d="M40 56 H560"/>
    <path d="M40 340 H560"/>
  </g>

  <!-- Luz encendida sobre Andy -->
  <path d="M266 126 H334 L424 336 H176 Z" fill="#C98A3E" fill-opacity="0.16"/>

  <!-- Detección: ondas del sensor -->
  <g fill="none" stroke="#2E86C1" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 12">
    <path d="M106 92 A44 44 0 0 0 194 92"/>
    <path d="M80 100 A72 72 0 0 0 220 100"/>
  </g>

  <!-- Sensor en el techo -->
  <path d="M132 58 A18 18 0 0 0 168 58 Z" fill="#FFFFFF" stroke="#16283F" stroke-width="6" stroke-linejoin="round"/>

  <!-- Lámpara -->
  <g stroke="#16283F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 58 V78" fill="none" stroke-width="6"/>
    <path d="M262 112 Q262 78 300 78 Q338 78 338 112 Z" fill="#2E86C1" stroke-width="6"/>
    <circle cx="300" cy="120" r="10" fill="#C98A3E" stroke-width="4"/>
  </g>

  <!-- Puerta por la que entró -->
  <g fill="none" stroke="#16283F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 340 V150 H540 V340" stroke-width="6"/>
    <circle cx="480" cy="250" r="3" fill="#16283F" stroke-width="4"/>
  </g>

  <!-- Andy -->
  <g transform="translate(200 112)">
    <g stroke="#16283F" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 70 V46" fill="none" stroke-width="8"/>
      <path d="M70 190 V226 M59 226 H81" fill="none" stroke-width="8"/>
      <path d="M130 190 V226 M119 226 H141" fill="none" stroke-width="8"/>
      <path d="M40 190 V130 A60 60 0 0 1 160 130 V190 Z" fill="#2E86C1" stroke-width="8"/>
      <circle cx="100" cy="128" r="24" fill="#C98A3E" stroke-width="8"/>
      <path d="M86 162 Q100 176 114 162" fill="none" stroke-width="6"/>
      <circle cx="100" cy="37" r="7" fill="#C98A3E" stroke-width="4"/>
    </g>
    <circle cx="108" cy="120" r="5" fill="#FFFFFF"/>
  </g>
</svg>
